source = ~/.config/hypr/colors.conf

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true
}

# uncomment to enable fingerprint authentication
# auth {
#     fingerprint {
#         enabled = true
#         ready_message = Scan fingerprint to unlock
#         present_message = Scanning...
#         retry_delay = 250 # in milliseconds
#     }
# }

background {
    color = $background
    path = $wallpaper
    blur_passes = 1
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

# TIME
# Hours
label {
	monitor =
	text = cmd[update:1000] echo "$(date +"%H")"
	color = $background

	font_size = 160
	font_family = $font ExtraBold

	position = 0, 200
    halign = center
    valign = center
}

# Minutes
label {
	monitor =
	text = cmd[update:1000] echo "$(date +"%M")"
	color = $background


	font_size = 160
	font_family = $font ExtraBold

	position = 0, 0
    halign = center
    valign = center
}

input-field {
    size = 350, 60
    outline_thickness = 0

    dots_size = 0.2
    dots_center = true

    inner_color = $background
    font_color = $accent-bright
    # check_color = $on_surface
    # fail_color = $error

    fade_on_empty = true

    placeholder_text =    ▚▞ ▛▟ ▚▞
    fail_text =    ▚▞ ▛▟ ▚▞

    font_family = $font

    position = 0, -200

    shadow_passes = 3
    shadow_size = 1
    shadow_boost = 0.3
}
